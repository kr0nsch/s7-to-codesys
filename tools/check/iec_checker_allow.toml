# Обоснованные находки iec_checker (tools/check/run_iec_checker.py).
# Обоснованная находка попадает в отчёт со статусом allowed и не роняет проверку.
# Подробный разбор каждой записи — docs/STATIC_ANALYSIS.md; при изменении кода держите их согласованными.
#
# Ключи записи [[allow]]:
#   id     — идентификатор правила iec_checker (шаблон fnmatch), например "PLCOPEN-CP3";
#   file   — шаблон fnmatch пути исходника (src/POUs/...) или имени собранного файла (FB_X.st);
#            '*' захватывает и '/';
#   match  — необязательно: регулярное выражение по тексту сообщения;
#   reason — обязательно: почему находка допустима.
# ParserError и LexingError обосновать нельзя: их исправляют в коде или в понижении iec-checker.
#
# Проект s7-to-codesys: статанализ запускается обёрткой tools_project/iec_checker_gate.py — она вызывает
# run_iec_checker.py и дополнительно принимает ParserError только в местах из
# tools_project/iec_checker_parser_gaps.toml (конструкции CODESYS, которых нет в грамматике iec_checker 0.4).

# --- Все исходники -------------------------------------------------------------------------------------

[[allow]]
id = "PLCOPEN-CP3"
file = "src/*"
reason = "Переменная без явного начального значения получает значение по умолчанию своего типа (МЭК 61131-3, как в CODESYS); вариант сборки iec-checker убирает неконстантные начальные значения"

[[allow]]
id = "PLCOPEN-CP3"
file = "tests/*"
reason = "Как для src/: значения по умолчанию типов; результаты тестов присваиваются до чтения"

# --- Сгенерированный код (src/*/Converted, s7conv build-corpus) ----------------------------------------
# Конвертер переносит логику и интерфейс блоков S7 один к одному: структура ветвлений, сложность и состав
# переменных — как в исходном SCL. Переработка (упрощение, удаление неиспользуемого) — ручной этап
# миграции после конвертации (docs/methodology.md), а не задача конвертера. Перечень находок по файлам —
# docs/STATIC_ANALYSIS.md, раздел «iec_checker: сгенерированный код».

[[allow]]
id = "PLCOPEN-CP9"
file = "src/*/Converted/*"
reason = "Сложность тела — как у исходного блока SCL (конвертер не меняет структуру); iec_checker 0.4 к тому же считает её завышенно"

[[allow]]
id = "PLCOPEN-L17"
file = "src/*/Converted/*"
reason = "IF без ELSE и CASE без ELSE перенесены из SCL как есть: «иначе» в исходной логике — сохранить состояние"

[[allow]]
id = "PLCOPEN-L10"
file = "src/POUs/Converted/FC_Statistics/*"
reason = "CONTINUE перенесён из SCL (FC_Statistics проверяет CONTINUE и RETURN при конвертации)"

[[allow]]
id = "PLCOPEN-CP4"
file = "src/GVLs/Converted/GVL_IO.gvl.st"
match = "%WI3[234]"
reason = "Ложное срабатывание iec_checker 0.4: номер слова %IW32/%IW33/%IW34 он считает номером байта; в CODESYS это байты 64–65, 66–67, 68–69 (S7 %IW64/%IW66/%IW68) — перекрытия нет"

[[allow]]
id = "UnusedVariable"
file = "src/*/Converted/*"
reason = "Ложные срабатывания iec_checker 0.4 (вызовы экземпляров ФБ и чтение их выходов, аргументы во вложенных вызовах, запись полей структуры, константы в границах FOR) и переменные интерфейса S7, которые используют только непереведённые операторы (MIGRATION-TODO) или стартовая информация OB; список — docs/STATIC_ANALYSIS.md"

# --- Рукописный слой совместимости (src/*/S7Compat) ----------------------------------------------------

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/S7Compat/FB_S7T*/FB_S7T*.impl.st"
reason = "Таймеры S7Compat: без ветки «иначе» выходы и момент отсчёта сохраняют значение (так и задумано семантикой TON/TOF/TP)"

# --- Тесты ---------------------------------------------------------------------------------------------

[[allow]]
id = "PLCOPEN-CP9"
file = "tests/*"
reason = "Наборы тестов — последовательные вызовы без ветвлений (классическая сложность — 1); завышенный подсчёт iec_checker 0.4, метрика для тестов не показательна"

[[allow]]
id = "PLCOPEN-L17"
file = "tests/*"
reason = "Тесты: однократный запуск сценария (IF NOT xDone) и тесты на несколько циклов (IF NOT xRtDone, IF xRtDone) — в остальных циклах делать нечего, ветка ELSE не нужна"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/*_Test/*_Test.decl.st"
match = "variable: [A-Z][A-Z0-9]*(_[A-Z0-9]+)+$"
reason = "Артефакт понижения: константы набора (VAR CONSTANT, UPPER_SNAKE_CASE) используются в методах-тестах, которые сборка выносит в отдельные функции"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/*Test/*Test.decl.st"
match = "variable: (FB|X|T|I)[A-Z0-9_]+$"
reason = "Артефакт понижения: переменные набора (экземпляры блоков, флаги и состояние тестов на несколько циклов) используются в методах-тестах, которые сборка выносит в отдельные функции"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/S7Compat/*/*.method.decl.st"
match = "FBDUT"
reason = "Ложное срабатывание iec_checker 0.4: экземпляр используется вызовом fbDut(...) и чтением выходов — это он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/PRG_Tests/PRG_Tests.decl.st"
match = "variable: FB[A-Z0-9_]*TEST$"
