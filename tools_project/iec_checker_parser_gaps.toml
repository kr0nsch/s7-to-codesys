# Места, где iec_checker 0.4 не разбирает допустимый в CODESYS ST текст (ParserError), — для
# tools_project/iec_checker_gate.py. run_iec_checker.py шаблона ParserError не обосновывает; обёртка
# принимает его только здесь. Разбор — docs/STATIC_ANALYSIS.md, раздел «iec_checker: пробелы разборщика».
#
# Ключи записи [[gap]]:
#   file   — путь исходника от корня (точно);
#   match  — регулярное выражение по тексту строки исходника, на которой разборщик остановился
#            (номера строк сгенерированного кода меняются, текст конструкции — нет);
#   reason — какую конструкцию не понимает разборщик и почему её нельзя заменить.
# Запись, которой больше не соответствует ни одна находка, — ошибка: список держится актуальным.
# После ParserError iec_checker файл дальше не анализирует — эти файлы проверяют компиляторы (RuSTy,
# CODESYS) и st_lint.

[[gap]]
file = "src/POUs/S7Compat/F_S7Now/F_S7Now.impl.st"
match = '\bTIME\(\)'
reason = "Оператор CODESYS TIME() (время с запуска ПЛК) — единственный источник времени без сторонних библиотек; в грамматике iec_checker 0.4 его нет. TIME() вызывается только здесь"

[[gap]]
file = "src/DUTs/Converted/UDT_DosingRecipe.dut.st"
match = 'ARRAY\[[^]]+\] OF \w+ := \['
reason = "Начальное значение массива в поле структуры: понижение iec-checker (tools/st_flavors.py, шаблон) заменяет тип массива в структуре типом элемента, а инициализатор [ ... ] оставляет; исправлять — в шаблоне"

[[gap]]
file = "src/POUs/Converted/FB_EventLogger/FB_EventLogger.impl.st"
match = '\]\.\w'
reason = "Поле элемента массива структур a[i].b: в грамматике iec_checker 0.4 нет обращения к полю после индекса"

[[gap]]
file = "src/POUs/Converted/PRG_Main/PRG_Main.impl.st"
match = '\]\.\w'
reason = "Поле элемента массива структур DB_Hmi.pump[1].startReq: в грамматике iec_checker 0.4 нет обращения к полю после индекса"

[[gap]]
file = "src/POUs/Converted/FB_Ramp/FB_Ramp.impl.st"
match = '^\s*;'
reason = "Пустой оператор ';' (в SCL — явная ветка «ничего не делать»): допустим в МЭК 61131-3 и CODESYS, iec_checker 0.4 требует в ветке хотя бы один оператор"

[[gap]]
file = "src/POUs/Converted/FB_Valve/FB_Valve.impl.st"
match = '^\s*;'
reason = "Пустой оператор ';' в ветке CASE (в SCL — ожидание сброса): допустим в МЭК 61131-3 и CODESYS, iec_checker 0.4 его не разбирает"
